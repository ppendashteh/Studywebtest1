<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C2255C">
<meta name="color-scheme" content="light dark">
<title>برنامه‌ی مطالعه‌ی کنکور</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F7F8FA;--sf:#fff;--ink:#1C2230;--mut:#6B7280;--line:#E5E7EC;--bar:#CDD2DC;--ac:#C2255C;--acink:#fff;--soft:#FBE7EF;--bad:#B42318}
@media (prefers-color-scheme:dark){:root{--bg:#12151C;--sf:#1B2029;--ink:#E8EBF2;--mut:#98A2B3;--line:#2A303C;--bar:#3B4354;--ac:#F06595;--acink:#2B0A17;--soft:#3A1624;--bad:#F97066}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,Roboto,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
main{max-width:560px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:22px;font-weight:700;line-height:1.3}
b{font-weight:600}
h2{font-size:15px;font-weight:600}
.mut{color:var(--mut)}
small,.small{font-size:12.5px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top p{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;background:var(--ac);color:var(--acink);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13.5px;border-radius:10px}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:10;background:var(--sf);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11.5px;color:var(--mut)}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--ac);font-weight:600}
#fab{position:fixed;z-index:9;inset-inline-start:16px;bottom:calc(84px + env(safe-area-inset-bottom));box-shadow:0 2px 10px rgba(0,0,0,.16);min-height:50px;padding:10px 22px;border-radius:25px}
.today{display:flex;gap:28px;align-items:flex-end;margin:6px 0 12px}
.big b{display:block;font-size:44px;line-height:1.1;font-weight:600;letter-spacing:-.5px}
.big span{font-size:13px;color:var(--mut)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--ac));border-radius:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:14px 0 4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--mut);min-width:0;white-space:nowrap}
.wd .v{height:16px;line-height:16px;font-size:11.5px;color:var(--ink)}
.trk{position:relative;width:100%;height:96px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.trk::after{content:'';position:absolute;inset-inline:0;bottom:var(--g);border-top:1px dashed var(--line)}
.trk i{display:block;width:46%;max-width:24px;border-radius:7px 7px 2px 2px;background:var(--bar);position:relative;z-index:1}
.wd.today i{background:var(--ac)}
.wd.today span{color:var(--ink);font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 4px;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:start}
.row .grow{flex:1;display:flex;flex-direction:column;min-width:0}
.row .end{display:flex;flex-direction:column;align-items:flex-end;text-align:end;flex:none}
.row small{line-height:1.5}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--c,var(--ac))}
.day{font-size:12.5px;color:var(--mut);margin:18px 0 0;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;white-space:nowrap;color:var(--mut)}
.chip[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:4px 0 16px}
.kpi b{display:block;font-size:32px;font-weight:600;line-height:1.15}
.kpi span{display:block;font-size:13px;color:var(--mut)}
.kpi small{display:block;color:var(--mut);margin-top:2px}
.panel{margin:0 -4px}
.panel svg{display:block;width:100%;height:auto;direction:ltr}
.gl{stroke:var(--line);stroke-width:1}
.br{fill:var(--bar)}.br.on{fill:var(--ac)}
.lbl{fill:var(--mut);font-size:11px}.lbl.on{fill:var(--ink);font-weight:600}
.hit{fill:transparent;cursor:pointer}
.detail{font-size:13.5px;padding:8px 4px 2px;min-height:32px}
.pct{font-size:20px;font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--mut);margin-inline-end:6px}
.empty{padding:30px 6px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.back{color:var(--ac);font-weight:700;padding:4px 0;margin-bottom:6px}
.sub-h{display:flex;align-items:center;gap:8px;margin:24px 0 2px}
#scrim{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:20}
#sheet{position:fixed;z-index:30;inset-inline:0;bottom:0;max-width:560px;margin:0 auto;background:var(--sf);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:50%;background:var(--line);font-size:15px}
.f{margin-bottom:12px}
.f>label,.f>.lab{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
input[type=text],input[type=date],select,textarea{width:100%;min-height:46px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
input[type=date]{text-align:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin:2px 0 6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--sf),0 0 0 5px var(--c)}
.swatches input:focus-visible+span{outline:2.5px solid var(--ink);outline-offset:4px}
details summary{cursor:pointer;font-weight:700;padding:8px 0}
#toast{position:fixed;z-index:40;inset-inline:0;bottom:calc(96px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:88vw;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<main id="main"></main>
<button id="fab" class="btn" data-act="newlog" hidden>+ ثبت مطالعه</button>
<nav class="tabbar" aria-label="بخش‌ها">
  <button class="tab" data-act="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>امروز</button>
  <button class="tab" data-act="tab" data-v="stats"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>گزارش</button>
  <button class="tab" data-act="tab" data-v="lib"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>منابع</button>
  <button class="tab" data-act="tab" data-v="exams"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg>آزمون‌ها</button>
  <button class="tab" data-act="tab" data-v="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>تنظیمات</button>
</nav>
<div id="scrim" data-act="closesheet" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const fa=n=>String(n).replace(/-/g,'−');
const toNum=v=>{if(v==null)return NaN;const s=String(v).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[٫,]/g,'.').replace(/[٬،]/g,'').replace(/−/g,'-').trim();return s===''?NaN:Number(s)};
const nz=s=>{const n=toNum(s);return isNaN(n)?(String(s).trim()===''?0:NaN):n};
const round1=n=>Math.round(n*10)/10;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((a-b)/864e5);
const todayStr=()=>ymd(new Date());
const weekStart=d=>addDays(d,-((d.getDay()+1)%7));
const jf=o=>new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',o);
const fFull=s=>jf({weekday:'long',day:'numeric',month:'long'}).format(pd(s));
const fDay=s=>jf({day:'numeric',month:'long'}).format(pd(s));
const fShort=s=>jf({day:'numeric',month:'short'}).format(pd(s));
const fYear=s=>jf({year:'numeric',month:'long',day:'numeric'}).format(pd(s));
function durText(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;if(h&&m)return `${fa(h)} ساعت و ${fa(m)} دقیقه`;if(h)return `${fa(h)} ساعت`;return `${fa(m)} دقیقه`}
const clock=min=>`${fa(Math.floor(min/60))}:${fa(pad(Math.round(min%60)))}`;
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const COLORS=['#2563EB','#0D9488','#D97706','#7C3AED','#DC2626','#059669','#DB2777','#0284C7','#65A30D','#9333EA','#EA580C','#64748B'];
const PRESETS={math:['ریاضی','فیزیک','شیمی'],exp:['زیست‌شناسی','ریاضی','فیزیک','شیمی'],hum:['ریاضی و آمار','اقتصاد','علوم اجتماعی','تاریخ','جغرافیا','فلسفه و منطق','روان‌شناسی']};
const COMMON=['ادبیات فارسی','زبان عربی','دین و زندگی','زبان انگلیسی'];

/* ---------- state ---------- */
const KEY='konkur-tracker-v1';
const blank=()=>({v:1,subjects:[],books:[],chapters:[],logs:[],exams:[],goal:4,lastSubject:''});
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('ذخیره‌سازی در مرورگر انجام نشد')}}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const sub=id=>S.subjects.find(s=>s.id===id)||{name:'درس حذف‌شده',color:'#98A2B3'};
const bk=id=>S.books.find(b=>b.id===id);
const chp=id=>S.chapters.find(c=>c.id===id);
const chName=c=>c.title+(c.to>0?` (ص ${fa(c.from)} تا ${fa(c.to)})`:'');
let tab='home',period=7,metric='min',selB=null,examSub='all',openBook=null,deferredInstall=null;
const MAIN=document.getElementById('main');

/* ---------- aggregation ---------- */
function agg(a,b){const r={min:0,tests:0,by:{}};for(const l of S.logs){if(l.date>=a&&l.date<=b){r.min+=l.min;r.tests+=l.tests;const x=r.by[l.subjectId]||(r.by[l.subjectId]={min:0,tests:0});x.min+=l.min;x.tests+=l.tests}}return r}
function byDate(){const m={};for(const l of S.logs){const t=m[l.date]||(m[l.date]={min:0,tests:0});t.min+=l.min;t.tests+=l.tests}return m}
function coverage(c){
  if(!(c.to>=c.from)||!(c.from>0))return null;
  const iv=S.logs.filter(l=>l.chapterId===c.id&&l.pFrom>0&&l.pTo>=l.pFrom).map(l=>[Math.max(l.pFrom,c.from),Math.min(l.pTo,c.to)]).filter(a=>a[1]>=a[0]).sort((a,b)=>a[0]-b[0]);
  let cov=0,cs=null,ce=null;
  for(const [a,b] of iv){if(cs==null){cs=a;ce=b}else if(a<=ce+1){ce=Math.max(ce,b)}else{cov+=ce-cs+1;cs=a;ce=b}}
  if(cs!=null)cov+=ce-cs+1;
  return cov/(c.to-c.from+1);
}
function statsFor(pred){let min=0,tests=0;for(const l of S.logs)if(pred(l)){min+=l.min;tests+=l.tests}return{min,tests}}

/* ---------- views ---------- */
function emptySetup(){return `<h1>خوش آمدی</h1><p class="mut" style="margin:8px 0 20px">رشته‌ات را انتخاب کن تا درس‌ها خودکار ساخته شوند. بعداً می‌توانی درس اضافه یا حذف کنی.</p><div class="stack"><button class="btn" data-act="setup" data-v="math">ریاضی و فنی</button><button class="btn" data-act="setup" data-v="exp">علوم تجربی</button><button class="btn" data-act="setup" data-v="hum">علوم انسانی</button><button class="btn ghost" data-act="setup" data-v="none">درس‌ها را خودم وارد می‌کنم</button></div>`}

function logRow(l){
  const s=sub(l.subjectId),b=bk(l.bookId),c=chp(l.chapterId);
  const meta=[b&&b.title,c&&c.title,l.pFrom>0?`ص ${fa(l.pFrom)} تا ${fa(l.pTo)}`:''].filter(Boolean).join('، ');
  return `<button class="row" data-act="editlog" data-id="${l.id}"><i class="dot" style="--c:${s.color}"></i><span class="grow"><b>${esc(s.name)}</b>${meta?`<small class="mut">${esc(meta)}</small>`:''}</span><span class="end">${l.min?`<b>${durText(l.min)}</b>`:''}${l.tests?`<small class="mut">${fa(l.tests)} تست</small>`:''}</span></button>`;
}

function vHome(){
  if(!S.subjects.length)return emptySetup();
  const T=byDate(),td=todayStr(),t=T[td]||{min:0,tests:0};
  const goalMin=S.goal*60,pct=goalMin?Math.min(100,t.min/goalMin*100):0;
  const ws=weekStart(new Date()),wd=[];let wm=0,wt=0;
  for(let i=0;i<7;i++){const d=ymd(addDays(ws,i)),x=T[d]||{min:0,tests:0};wm+=x.min;wt+=x.tests;wd.push({d,x})}
  const sc=Math.max(goalMin,...wd.map(q=>q.x.min),1);
  const wk=wd.map((q,i)=>`<div class="wd ${q.d===td?'today':''}"><span class="v">${q.x.min?fa(round1(q.x.min/60)):''}</span><div class="trk" style="--g:${goalMin/sc*100}%">${q.d>td?'':`<i style="height:${q.x.min?Math.max(q.x.min/sc*100,2.5):0}%"></i>`}</div><span>${WD[i]}</span></div>`).join('');
  const L=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts).slice(0,40);
  let list='',cur='';
  for(const l of L){if(l.date!==cur){cur=l.date;list+=`<p class="day">${l.date===td?'امروز':fFull(l.date)}</p>`}list+=logRow(l)}
  return `<header class="top"><div><p class="mut small">برنامه‌ی مطالعه‌ی کنکور</p><h1>امروز</h1><p class="mut">${fFull(td)}</p></div></header>
  <div class="today"><div class="big"><b>${clock(t.min)}</b><span>ساعت مطالعه</span></div><div class="big"><b>${fa(t.tests)}</b><span>تست</span></div></div>
  <div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <p class="mut small" style="margin-top:6px">هدف روزانه: ${fa(S.goal)} ساعت</p>
  <div class="sec"><h2>این هفته</h2><span class="mut small">${fa(round1(wm/60))} ساعت، ${fa(wt)} تست</span></div>
  <div class="week">${wk}</div>
  <div class="sec"><h2>ثبت‌های اخیر</h2></div>
  ${list||`<div class="empty"><b>هنوز چیزی ثبت نشده</b>بعد از هر جلسه‌ی مطالعه یا تست‌زنی، دکمه‌ی «ثبت مطالعه» را بزن.</div>`}`;
}

function niceTick(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const k of [1,1.5,2,2.5,3,4,5,6,8,10])if(k*p>=raw)return k*p;return 10*p}

function barChart(B,names){
  const W=340,H=250,pl=6,pr=6,pt=28,pb=32,iw=W-pl-pr,ih=H-pt-pb;
  const key=metric==='min'?'min':'tests',val=x=>metric==='min'?x/60:x;
  const tot=B.map(b=>val(b[key])),mx=Math.max(...tot,metric==='min'?1:5);
  const step=iw/B.length,bw=Math.max(4,Math.min(30,step*.56)),every=Math.ceil(B.length/7);
  let g=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/>`;
  B.forEach((b,i)=>{
    const cx=W-pr-(i+.5)*step,on=i===selB,v=tot[i],hh=v>0?Math.max(ih*v/mx,3):0,y=pt+ih-hh;
    if(hh)g+=`<rect class="br${on?' on':''}" x="${cx-bw/2}" y="${y}" width="${bw}" height="${hh}" rx="${Math.min(bw/2,5)}"/>`;
    if(v>0&&(on||B.length<=8))g+=`<text class="lbl${on?' on':''}" text-anchor="middle" x="${cx}" y="${y-8}">${fa(metric==='min'?round1(v):Math.round(v))}</text>`;
    g+=`<rect class="hit" x="${cx-step/2}" y="${pt-18}" width="${step}" height="${ih+pb+18}" data-act="bucket" data-v="${i}"/>`;
    if((B.length-1-i)%every===0)g+=`<text class="lbl${on?' on':''}" text-anchor="middle" x="${cx}" y="${H-10}">${names?WD[(pd(b.s).getDay()+1)%7]:fShort(b.s)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار ${metric==='min'?'ساعت مطالعه':'تعداد تست'}">${g}</svg>`;
}

function vStats(){
  if(!S.subjects.length)return emptySetup();
  const n=period,end=pd(todayStr()),endS=ymd(end);
  const cur=agg(ymd(addDays(end,-(n-1))),endS),prev=agg(ymd(addDays(end,-(2*n-1))),ymd(addDays(end,-n)));
  const span=n===1?7:n,per=span>31?7:1,cnt=Math.ceil(span/per),first=addDays(end,-(cnt*per-1));
  const B=[];for(let i=0;i<cnt;i++){const s=addDays(first,i*per);B.push({s:ymd(s),e:ymd(addDays(s,per-1)),min:0,tests:0,by:{}})}
  const fs=ymd(first);
  for(const l of S.logs){if(l.date<fs||l.date>endS)continue;const i=Math.min(cnt-1,Math.floor(diffDays(pd(l.date),first)/per)),b=B[i];b.min+=l.min;b.tests+=l.tests;const x=b.by[l.subjectId]||(b.by[l.subjectId]={min:0,tests:0});x.min+=l.min;x.tests+=l.tests}
  if(selB==null||selB>=cnt)selB=cnt-1;
  const sb=B[selB],sbLabel=per===1?fFull(sb.s):`${fDay(sb.s)} تا ${fDay(sb.e>endS?endS:sb.e)}`;
  const plabel=n===1?'دیروز':'دوره‌ی قبل';
  const dt=(c,p)=>{if(!p)return '';const x=Math.round((c-p)/p*100);return x===0?`برابر با ${plabel}`:`${fa(Math.abs(x))}% ${x>0?'بیشتر':'کمتر'} از ${plabel}`};
  const chips=[[1,'روزانه'],[7,'هفتگی'],[30,'ماهانه'],[91,'3 ماهه'],[182,'6 ماهه']].map(([v,l])=>`<button class="chip" aria-pressed="${v===n}" data-act="period" data-v="${v}">${l}</button>`).join('');
  const title=n===1?'7 روز اخیر':per===1?`${fa(cnt)} روز اخیر`:`${fa(cnt)} هفته‌ی اخیر`;
  const rows=S.subjects.map(s=>({s,x:cur.by[s.id]||{min:0,tests:0}})).filter(r=>r.x.min||r.x.tests).sort((a,b)=>b.x[metric==='min'?'min':'tests']-a.x[metric==='min'?'min':'tests']);
  const mxv=Math.max(1,...rows.map(r=>r.x[metric==='min'?'min':'tests']));
  const brk=rows.map(r=>`<div class="row" style="display:block"><div style="display:flex;gap:10px;align-items:center"><i class="dot" style="--c:${r.s.color}"></i><b style="flex:1">${esc(r.s.name)}</b><span class="small">${r.x.min?durText(r.x.min):'–'}</span><span class="small mut" style="min-width:64px;text-align:end">${fa(r.x.tests)} تست</span></div><div class="bar" style="margin-top:7px;--c:${r.s.color}"><i style="width:${r.x[metric==='min'?'min':'tests']/mxv*100}%"></i></div></div>`).join('');
  return `<header class="top"><h1>گزارش</h1></header>
  <div class="chips">${chips}</div>
  <div class="kpis"><div class="kpi"><b>${fa(round1(cur.min/60))}</b><span>ساعت مطالعه</span><small>${dt(cur.min,prev.min)}</small>${n>1?`<small>میانگین روزانه: ${fa(round1(cur.min/60/n))} ساعت</small>`:''}</div>
  <div class="kpi"><b>${fa(cur.tests)}</b><span>تست</span><small>${dt(cur.tests,prev.tests)}</small>${n>1?`<small>میانگین روزانه: ${fa(Math.round(cur.tests/n))} تست</small>`:''}</div></div>
  <div class="sec" style="margin-top:8px"><h2>${title}</h2><div class="chips" style="margin:0;padding:0"><button class="chip" aria-pressed="${metric==='min'}" data-act="metric" data-v="min">ساعت</button><button class="chip" aria-pressed="${metric==='tests'}" data-act="metric" data-v="tests">تست</button></div></div>
  <div class="panel">${barChart(B,per===1&&cnt===7)}<p class="detail"><b>${sbLabel}:</b> ${sb.min?durText(sb.min):'بدون مطالعه'}${sb.tests?`، ${fa(sb.tests)} تست`:''}</p></div>
  <div class="sec"><h2>به تفکیک درس</h2></div>
  ${brk||`<div class="empty"><b>در این بازه چیزی ثبت نشده</b>از تب «امروز» مطالعه یا تست ثبت کن.</div>`}`;
}

function bookStat(b){
  const st=statsFor(l=>l.bookId===b.id);let tot=0,cov=0;
  for(const c of S.chapters.filter(c=>c.bookId===b.id)){const p=coverage(c);if(p!=null){const len=c.to-c.from+1;tot+=len;cov+=p*len}}
  return{...st,pct:tot?cov/tot:null,chs:S.chapters.filter(c=>c.bookId===b.id).length};
}

}

function vBook(b){

  <p class="mut small"><span class="tag">${esc(b.kind)}</span>${b.publisher?esc(b.publisher)+'، ':''}${st.min?durText(st.min):'بدون مطالعه'}${st.tests?`، ${fa(st.tests)} تست`:''}${st.pct!=null?`، ${fa(Math.round(st.pct*100))}% پیشرفت`:''}</p>

  <div style="margin-top:18px"><button class="btn ghost" data-act="logbook" data-id="${b.id}">ثبت مطالعه برای این منبع</button></div>`;

function lineChart(P){
  const W=340,H=250,pl=8,pr=34,pt=28,pb=32,iw=W-pl-pr,ih=H-pt-pb;
  const vals=P.map(p=>p.v),lo=Math.min(0,Math.floor(Math.min(...vals)/20)*20),hi=100;
  const X=i=>{const a=pl+14,b=W-pr-8;return P.length===1?(a+b)/2:b-(i/(P.length-1))*(b-a)};
  const Y=v=>pt+ih-ih*(v-lo)/(hi-lo);
  let g='';
  for(const v of new Set([lo,0,50,100].filter(v=>v>=lo)))g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="lbl" x="${W-pr+7}" y="${Y(v)+4}">${fa(v)}</text>`;
  g+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${P.map((p,i)=>`${X(i)},${Y(p.v)}`).join(' ')}"/>`;
  const every=Math.ceil(P.length/6),mxi=vals.indexOf(Math.max(...vals)),last=P.length-1;
  P.forEach((p,i)=>{
    const key=i===last||i===mxi;
    g+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${key?4.5:3.2}" fill="${key?'var(--ac)':'var(--sf)'}" stroke="var(--ac)" stroke-width="2"/>`;
    if(P.length<=6||key)g+=`<text class="lbl${key?' on':''}" text-anchor="middle" x="${X(i)}" y="${Y(p.v)-10}">${fa(round1(p.v))}</text>`;
    if((P.length-1-i)%every===0)g+=`<text class="lbl" text-anchor="middle" x="${X(i)}" y="${H-10}">${fShort(p.d)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار پیشرفت درصد آزمون‌ها">${g}</svg>`;
}

function vExams(){
  const ex=[...S.exams].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  const head=`<header class="top"><h1>آزمون‌ها</h1><button class="btn sm" data-act="addexam">+ ثبت آزمون</button></header>`;
  if(!ex.length)return head+`<div class="empty"><b>هنوز آزمونی ثبت نشده</b>درصد کل (و اگر خواستی درصد هر درس) را بعد از هر آزمون وارد کن تا نمودار پیشرفتت ساخته شود.</div>`;
  const withSub=S.subjects.filter(s=>ex.some(e=>e.subs&&e.subs[s.id]!=null));
  if(examSub!=='all'&&!withSub.some(s=>s.id===examSub))examSub='all';
  const get=e=>examSub==='all'?e.overall:(e.subs||{})[examSub];
  const P=ex.filter(e=>get(e)!=null).map(e=>({v:get(e),d:e.date}));
  const chips=[`<button class="chip" aria-pressed="${examSub==='all'}" data-act="examsub" data-v="all">درصد کل</button>`,...withSub.map(s=>`<button class="chip" aria-pressed="${examSub===s.id}" data-act="examsub" data-v="${s.id}">${esc(s.name)}</button>`)].join('');
  let stats='';
  if(P.length){const last=P[P.length-1].v,avg=P.reduce((a,p)=>a+p.v,0)/P.length,best=Math.max(...P.map(p=>p.v)),dl=P.length>1?last-P[P.length-2].v:null;
    stats=`<div class="kpis" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px"><div class="kpi"><b style="font-size:26px">${fa(round1(last))}%</b><span>آخرین</span>${dl!=null?`<small>${dl>=0?'+':'−'}${fa(round1(Math.abs(dl)))} نسبت به قبل</small>`:''}</div><div class="kpi"><b style="font-size:26px">${fa(round1(avg))}%</b><span>میانگین</span></div><div class="kpi"><b style="font-size:26px">${fa(round1(best))}%</b><span>بهترین</span></div></div>`}
  const list=[...ex].reverse().map(e=>{const ch=S.subjects.filter(s=>e.subs&&e.subs[s.id]!=null).map(s=>`<span class="tag" style="margin-top:4px">${esc(s.name)} ${fa(round1(e.subs[s.id]))}%</span>`).join('');
    return `<button class="row" data-act="editexam" data-id="${e.id}"><span class="grow"><b>${esc(e.title||'آزمون')}</b><small class="mut">${fDay(e.date)}</small><span style="display:block">${ch}</span></span><span class="pct">${fa(round1(e.overall))}%</span></button>`}).join('');
  return head+`<div class="chips">${chips}</div><div class="panel">${P.length?lineChart(P):`<p class="empty">برای این درس هنوز درصدی ثبت نشده.</p>`}</div>${stats}<div class="sec"><h2>همه‌ی آزمون‌ها</h2></div>${list}`;
}

  <div class="f"><label for="e-date">تاریخ</label><input id="e-date" type="date" value="${e.date}" max="${todayStr()}"></div>
  <div class="f"><label for="e-all">درصد کل</label><input id="e-all" type="text" inputmode="decimal" value="${e.overall===''?'':fa(e.overall)}" placeholder="مثلاً 62.5"></div>
  <details ${Object.keys(e.subs||{}).length?'open':''}><summary>درصد هر درس (اختیاری)</summary><div class="g2">${S.subjects.map(s=>`<div class="f"><label for="e-s-${s.id}">${esc(s.name)}</label><input id="e-s-${s.id}" data-sub="${s.id}" type="text" inputmode="decimal" value="${(e.subs||{})[s.id]!=null?fa(e.subs[s.id]):''}"></div>`).join('')}</div></details>
  <p class="err" id="err" role="alert"></p>
  <div class="stack"><button class="btn" type="submit">ذخیره</button>${id?`<button type="button" class="btn danger" data-act="delexam" data-id="${id}">حذف آزمون</button>`:''}</div></form>`);
}

function subSheet(id){
  const s=id?sub(id):{name:'',color:COLORS[S.subjects.length%COLORS.length]};
  sheet(id?'ویرایش درس':'درس جدید',`<form data-form="sub" data-id="${id||''}" novalidate>
  <div class="f"><label for="s-name">نام درس</label><input id="s-name" type="text" value="${esc(s.name)}"></div>
  <div class="f"><span class="lab">رنگ</span><div class="swatches">${COLORS.map(c=>`<label><input type="radio" name="s-color" value="${c}"${c===s.color?' checked':''} aria-label="رنگ ${c}"><span style="--c:${c}"></span></label>`).join('')}</div></div>
  <p class="err" id="err" role="alert"></p>
  <div class="stack"><button class="btn" type="submit">ذخیره</button>${id?`<button type="button" class="btn danger" data-act="delsub" data-id="${id}">حذف درس</button>`:''}</div></form>`);
}

/* ---------- actions ---------- */
const ACT={
  tab(_,v){tab=v;openBook=null;render();scrollTo(0,0)},
  newlog(){if(!S.subjects.length){tab='set';render();return}logSheet()},
  editlog(id){logSheet(id)},
  closesheet:closeSheet,
  period(_,v){period=+v;selB=null;render()},
  metric(_,v){metric=v;selB=null;render()},
  bucket(_,v){selB=+v;render()},
  setup(_,v){
    if(v==='none'){tab='set';render();subSheet();return}
    const names=[...PRESETS[v],...COMMON];
    S.subjects=names.map((n,i)=>({id:uid(),name:n,color:COLORS[i%COLORS.length]}));save();render();
  },
  addbook(){if(!S.subjects.length){toast('اول یک درس اضافه کن');return}bookSheet()},
  editbook(id){bookSheet(id)},
  openbook(id){openBook=id;render();scrollTo(0,0)},
  back(){openBook=null;render()},
  addchap(id){chapSheet(null,id)},
  editchap(id){chapSheet(id)},
  logfor(id){const c=chp(id),b=bk(c.bookId);logSheet(null,{subjectId:b.subjectId,bookId:b.id,chapterId:c.id,pFrom:c.from>0?c.from:0,pTo:0})},
  logbook(id){const b=bk(id);logSheet(null,{subjectId:b.subjectId,bookId:b.id})},
  addexam(){examSheet()},editexam(id){examSheet(id)},
  examsub(_,v){examSub=v;render()},
  addsub(){subSheet()},editsub(id){subSheet(id)},
  setday(_,v){const d=ymd(addDays(new Date(),-v));$('f-date').value=d;$('jdate').textContent=fYear(d)},
  setmin(_,v){$('f-h').value=fa(Math.floor(v/60)||'');$('f-m').value=v%60?fa(v%60):''},
  dellog(id){if(!confirm('این ثبت حذف شود؟'))return;S.logs=S.logs.filter(l=>l.id!==id);save();closeSheet();render();toast('حذف شد')},
  delbook(id){if(!confirm('منبع و فصل‌هایش حذف شود؟ ثبت‌های مطالعه می‌مانند ولی از منبع جدا می‌شوند.'))return;
    const cs=S.chapters.filter(c=>c.bookId===id).map(c=>c.id);
    S.logs.forEach(l=>{if(l.bookId===id){l.bookId='';l.chapterId=''}});S.chapters=S.chapters.filter(c=>c.bookId!==id);S.books=S.books.filter(b=>b.id!==id);openBook=null;save();closeSheet();render();toast('حذف شد')},
  delchap(id){if(!confirm('این فصل حذف شود؟'))return;S.logs.forEach(l=>{if(l.chapterId===id)l.chapterId=''});S.chapters=S.chapters.filter(c=>c.id!==id);save();closeSheet();render();toast('حذف شد')},
  delexam(id){if(!confirm('این آزمون حذف شود؟'))return;S.exams=S.exams.filter(e=>e.id!==id);save();closeSheet();render();toast('حذف شد')},
  delsub(id){
    if(S.logs.some(l=>l.subjectId===id)||S.books.some(b=>b.subjectId===id)){setErr('این درس ثبت یا منبع دارد. اول آن‌ها را حذف کن یا فقط نامش را ویرایش کن.');return}
    if(!confirm('این درس حذف شود؟'))return;S.subjects=S.subjects.filter(s=>s.id!==id);S.exams.forEach(e=>{if(e.subs)delete e.subs[id]});save();closeSheet();render();toast('حذف شد')},
  export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`konkur-backup-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
  import(){$('imp').value='';$('imp').click()},
  reset(){if(!confirm('همه‌ی ثبت‌ها، منابع و آزمون‌ها برای همیشه پاک شود؟')||!confirm('مطمئنی؟ این کار برگشت ندارد.'))return;S=blank();save();tab='home';openBook=null;render();toast('پاک شد')},
  install(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall=null;render()}
};

const FORM={
  log(f){
    const id=f.dataset.id,g=x=>$(x).value;
    const subjectId=g('f-subject'),date=g('f-date'),bookId=g('f-book'),chapterId=bookId?g('f-chap'):'';
    const h=nz(g('f-h')),m=nz(g('f-m')),t=nz(g('f-tests')),pf=nz(g('f-pf')),pt=nz(g('f-pt'));
    if(!date)return setErr('تاریخ را وارد کن.');
    if([h,m,t,pf,pt].some(isNaN)||[h,m,t,pf,pt].some(x=>x<0))return setErr('در فیلدهای عددی فقط عدد مثبت بنویس.');
    const min=Math.round(h*60+m),tests=Math.round(t);
    if(!min&&!tests)return setErr('مدت مطالعه یا تعداد تست را وارد کن.');
    if((pf>0)!==(pt>0))return setErr('برای صفحه‌ها هم «از» و هم «تا» را وارد کن.');
    if(pf>0&&pt<pf)return setErr('صفحه‌ی پایان باید بعد از صفحه‌ی شروع باشد.');
    const rec={date,subjectId,bookId,chapterId,min,tests,pFrom:Math.round(pf),pTo:Math.round(pt),note:g('f-note').trim()};
    if(id)Object.assign(S.logs.find(l=>l.id===id),rec);else S.logs.push({id:uid(),ts:Date.now(),...rec});
    S.lastSubject=subjectId;save();closeSheet();render();toast('ثبت شد');
  },
  book(f){
    const id=f.dataset.id,title=$('b-title').value.trim();
    if(!title)return setErr('نام کتاب را وارد کن.');
    const rec={title,subjectId:$('b-sub').value,kind:$('b-kind').value,publisher:$('b-pub').value.trim()};
    let nid=id;if(id)Object.assign(bk(id),rec);else{nid=uid();S.books.push({id:nid,...rec})}
    save();closeSheet();if(!id){openBook=nid;tab='lib'}render();toast('ذخیره شد');
  },
  chap(f){
    const id=f.dataset.id,title=$('c-title').value.trim(),a=nz($('c-from').value),b=nz($('c-to').value);
    if(!title)return setErr('عنوان فصل را وارد کن.');
    if(isNaN(a)||isNaN(b)||a<0||b<0)return setErr('صفحه‌ها را به صورت عدد وارد کن.');
    if((a>0)!==(b>0))return setErr('هم صفحه‌ی شروع و هم پایان را وارد کن (یا هر دو را خالی بگذار).');
    if(a>0&&b<a)return setErr('صفحه‌ی پایان باید بعد از شروع باشد.');
    if(id)Object.assign(chp(id),{title,from:a,to:b});else S.chapters.push({id:uid(),bookId:f.dataset.book,title,from:a,to:b});
    save();render();
    if(id){closeSheet();toast('ذخیره شد')}else{toast('فصل اضافه شد');chapSheet(null,f.dataset.book,{title:'',from:b>0?b+1:0,to:0})}
  },
  exam(f){
    const id=f.dataset.id,date=$('e-date').value,o=toNum($('e-all').value);
    if(!date)return setErr('تاریخ را وارد کن.');
    if(isNaN(o)||o<-100||o>100)return setErr('درصد کل را به صورت عددی بین −100 تا 100 وارد کن.');
    const subs={};
    for(const el of f.querySelectorAll('[data-sub]')){if(el.value.trim()==='')continue;const v=toNum(el.value);if(isNaN(v)||v<-100||v>100)return setErr('درصد درس‌ها باید عددی بین −100 تا 100 باشد.');subs[el.dataset.sub]=v}
    const rec={title:$('e-title').value.trim(),date,overall:o,subs};
    if(id)Object.assign(S.exams.find(e=>e.id===id),rec);else S.exams.push({id:uid(),ts:Date.now(),...rec});
    save();closeSheet();render();toast('ثبت شد');
  },
  sub(f){
    const id=f.dataset.id,name=$('s-name').value.trim();
    if(!name)return setErr('نام درس را وارد کن.');
    const color=(f.querySelector('input[name=s-color]:checked')||{}).value||COLORS[0];
    if(id)Object.assign(S.subjects.find(s=>s.id===id),{name,color});else S.subjects.push({id:uid(),name,color});
    save();closeSheet();render();toast('ذخیره شد');
  }
};

const CHG={
  'f-subject'(t){const b=$('f-book');b.innerHTML=optList(S.books.filter(x=>x.subjectId===t.value).map(x=>({id:x.id,name:x.title})),'','بدون منبع');CHG['f-book'](b)},
  'f-book'(t){const c=$('f-chap');c.innerHTML=optList(S.chapters.filter(x=>x.bookId===t.value).map(x=>({id:x.id,name:chName(x)})),'','بدون فصل');c.disabled=!t.value},
  'f-date'(t){if(t.value)$('jdate').textContent=fYear(t.value)},
  goal(t){const v=toNum(t.value);if(isNaN(v)||v<=0||v>18){toast('عددی بین 0.5 تا 18 وارد کن');t.value=fa(S.goal);return}S.goal=v;save();toast('هدف ذخیره شد')},
  imp(t){
    const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.logs)||!Array.isArray(d.subjects))throw 0;
      if(!confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟'))return;S=Object.assign(blank(),d);save();tab='home';render();toast('بازیابی شد')}catch(e){toast('این فایل پشتیبان معتبر نیست')}};
    r.readAsText(f);
  }
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.id,el.dataset.v,el)});
document.addEventListener('submit',e=>{e.preventDefault();const fn=FORM[e.target.dataset.form];if(fn)fn(e.target)});
document.addEventListener('change',e=>{const fn=CHG[e.target.id];if(fn)fn(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(tab==='set'&&$('sheet').hidden)render()});

render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
